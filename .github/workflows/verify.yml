name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        # Public placeholder values only: the build should not need access to the real Firebase project.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDUMMY_CI_BUILD_ONLY_KEY0000000000"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "ci-placeholder.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "attendance-tracker-ci"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "attendance-tracker-ci.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789000:web:ci-placeholder"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ""
        run: npm run build
