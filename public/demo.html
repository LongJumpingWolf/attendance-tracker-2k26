function addSubject(){state.modal={type:'subject'};render()}
function createPingForm(mate){state.modal={type:'ping',mate:mate||null};render()}
function getPing(id){return state.pings.find(function(p){return p.id===id})}
function simulateReply(p){if(!p||p.status!=='asking')return;p.items=p.items.map(function(it,i){return {subject:it.subject,answer:i%3===1?'no':'yes'}});p.status='answered';showToast('A fictional reply arrived. Review it before integration.');render()}
function reviewPing(p,approve){if(!p)return;if(approve){p.items.forEach(function(it){if(it.answer==='yes'){var c=state.classes.find(function(x){return x.subject===it.subject})||{id:'review-'+p.id+'-'+it.subject,subject:it.subject,date:p.date,start:'09:00',end:'10:00',kind:'Lecture',status:null};if(!state.classes.some(function(x){return x.id===c.id}))state.classes.push(c);applyMark(c,p.date,'P')}});p.status='approved';showToast('Approved. Demo attendance updated once.')}else{p.status='dismissed';showToast('Dismissed. Attendance was left unchanged.')}render()}
function deleteTask(id){state.tasks=state.tasks.filter(function(t){return t.id!==id});state.modal=null;render();showToast('Demo task removed.')}
function markClass(id,date,mark){var c=state.classes.find(function(x){return x.id===id});if(!c){var bits=id.split('-');var s=subjectById(bits[1]);if(s)c={id:id,subject:s.id,date:date,start:s.slots[0]?s.slots[0].start:'09:00',end:s.slots[0]?s.slots[0].end:'10:00',kind:s.slots[0]?s.slots[0].kind:'Lecture',status:null}}
if(!c)return;var prev=classMark(c,date);var next=mark==='clear'?null:mark;if(prev===next){showToast('That mark is already set.');return}state.lastAction={c:Object.assign({},c),date:date,prev:prev};applyMark(c,date,next);render();showToast(next==='P'?'Marked present. Subject totals updated.':next==='A'?'Marked absent. Subject totals updated.':'Attendance mark cleared. Subject totals updated.')}
function openSubject(id){state.modal={type:'subject',id:id};render()}
root.addEventListener('click',function(e){var b=e.target.closest('[data-act],[data-page]');if(!b)return;if(b.hasAttribute('data-page')){e.preventDefault();go(b.getAttribute('data-page'));return}var act=b.getAttribute('data-act');var id=b.getAttribute('data-id');var date=b.getAttribute('data-date');var mark=b.getAttribute('data-mark');
if(act==='close-modal'){state.modal=null;render()}
else if(act==='modal-backdrop'&&e.target===b){state.modal=null;render()}
else if(act==='open-settings'){go('settings')}
else if(act==='start-tour'){startTour()}
else if(act==='skip-tour'){tourMove(-1)}
else if(act==='prev-tour'){tourMove(state.tour-1)}
else if(act==='next-tour'){tourMove(state.tour+1)}
else if(act==='add-task'){addTask()}
else if(act==='edit-task'){state.modal={type:'task',id:id};render()}
else if(act==='delete-task'){deleteTask(id)}
else if(act==='toggle-task'){var t=taskById(id);if(t){t.done=!t.done;render();showToast(t.done?'Task completed. Nice work.':'Task reopened.')} }
else if(act==='task-filter'){state.taskFilter=b.getAttribute('data-filter');render()}
else if(act==='add-subject'){addSubject()}
else if(act==='subject-detail'){openSubject(id)}
else if(act==='edit-subject-form'){state.modal={type:'edit-subject',id:(state.modal&&state.modal.id)};render()}
else if(act==='import-sample'){state.modal={type:'import'};render()}
else if(act==='apply-import'){state.subjects.forEach(function(s){var slots={path:[{day:1,start:'08:30',end:'09:30',kind:'Lecture'}],micro:[{day:3,start:'10:00',end:'11:00',kind:'Lecture'}],ent:[{day:5,start:'13:30',end:'15:00',kind:'Clinical'}]};if(slots[s.id])s.slots=s.slots.concat(slots[s.id])});state.imported=true;state.modal=null;render();showToast('Sample timetable applied in memory.')}
else if(act==='select-date'){state.selectedDate=date;render()}
else if(act==='prev-month'){state.calMonth--;if(state.calMonth<0){state.calMonth=11;state.calYear--}render()}
else if(act==='next-month'){state.calMonth++;if(state.calMonth>11){state.calMonth=0;state.calYear++}render()}
else if(act==='calendar'){go('calendar')}
else if(act==='add-mate'){state.modal={type:'mate'};render()}
else if(act==='edit-alias'){state.modal={type:'alias',id:id};render()}
else if(act==='toggle-connection'){var mate=state.mates.find(function(m){return m.id===id});if(mate){mate.connected=!mate.connected;showToast(mate.connected?'Demo connection accepted.':'Demo connection paused.');render()}}
else if(act==='mate-ping'){var mate=state.mates.find(function(m){return m.id===id});if(mate)createPingForm(mate)}
else if(act==='new-ping'){createPingForm(null)}
else if(act==='simulate-reply'){simulateReply(getPing(id))}
else if(act==='approve-ping'){reviewPing(getPing(id),true)}
else if(act==='dismiss-ping'){reviewPing(getPing(id),false)}
else if(act==='reset-demo'){resetState();render();showToast('Sandbox reset. All sample values restored.')}
else if(act==='mark'){markClass(id,date,mark)}
});
root.addEventListener('change',function(e){var t=e.target;var a=t.getAttribute('data-act-change');var id=t.getAttribute('data-id');if(a==='theme'){state.theme=t.checked?'dark':'light';render();showToast('Appearance changed for this demo tab.')}else if(a==='auto'){var m=state.mates.find(function(x){return x.id===id});if(m){m.auto=t.checked;showToast(m.auto?'Demo auto-integration enabled for this mate.':'Replies will ask for approval.')}}else if(a==='requirement'){var s=subjectById(id);if(s){s.requirement=Number(t.value);render();showToast('Attendance requirement updated in demo.')}}});
root.addEventListener('submit',function(e){var form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();var fd=new FormData(form);var typ=form.getAttribute('data-form');
if(typ==='task'){var title=String(fd.get('title')||'').trim();var due=String(fd.get('due')||'');if(!title||!due)return;var data={title:title,due:due,subject:String(fd.get('subject')||''),priority:String(fd.get('priority')||'Medium'),kind:String(fd.get('kind')||'Study')};if(state.modal&&state.modal.id){var t=taskById(state.modal.id);if(t)Object.assign(t,data);showToast('Task updated in this demo.')}else{state.tasks.push(Object.assign({id:uid(),done:false},data));showToast('Task added in this demo.')}state.modal=null;render()}
else if(typ==='subject'){var name=String(fd.get('name')||'').trim(),code=String(fd.get('code')||'').trim();if(!name||!code)return;state.subjects.push({id:uid(),name:name,code:code.toUpperCase(),teacher:'Demo faculty',room:'Demo room',attended:Number(fd.get('attended')||0),missed:Number(fd.get('missed')||0),requirement:Number(fd.get('requirement')||75),color:colors[state.subjects.length%colors.length],tags:['Demo'],slots:[]});state.modal=null;render();showToast('Subject added. It exists only in this demo session.')}
else if(typ==='mate'){var n=String(fd.get('name')||'').trim(),a=String(fd.get('alias')||'').trim();if(!n||!a)return;state.mates.push({id:uid(),name:n,alias:a,uid:'DEMO-'+Math.random().toString(36).slice(2,7).toUpperCase(),connected:true,covered:0,repaid:0,auto:false});state.modal=null;render();showToast('Fictional mate added. No request was sent.')}
else if(typ==='alias'){var m=state.mates.find(function(x){return x.id===String(fd.get('id'))});if(m){m.alias=String(fd.get('alias')||'').trim();state.modal=null;render();showToast('Alias changed in this demo.')}}
else if(typ==='edit-subject'){var s=subjectById(String(fd.get('id')));if(s){s.name=String(fd.get('name')||s.name).trim();s.code=String(fd.get('code')||s.code).trim().toUpperCase();s.attended=Number(fd.get('attended')||0);s.missed=Number(fd.get('missed')||0);state.modal={type:'subject',id:s.id};render();showToast('Subject details updated in this demo.')}}
else if(typ==='ping'){var items=fd.getAll('items');if(!items.length){showToast('Select at least one class.');return}var target=String(fd.get('target')||'A friend (demo link)');var p={id:uid(),target:target,date:String(fd.get('date')||iso(new Date())),items:items.map(function(sub){return {subject:String(sub),answer:null}}),status:'asking',source:target.indexOf('demo link')>=0?'WhatsApp':'In-app'};state.pings.push(p);state.modal=null;state.page='mates';render();showToast('Demo Ping created. No message was sent.')}}
);
root.addEventListener('input',function(e){if(e.target&&e.target.id==='search'){var start=e.target.selectionStart;state.search=e.target.value;var active=document.activeElement;var pos=active===e.target?start:null;render();var next=$('#search');if(next){next.focus();if(pos!==null)next.setSelectionRange(pos,pos)}}});
root.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.modal){state.modal=null;render()}else if(e.key==='Escape'&&state.tour>=0){tourMove(-1)}});
render();
})();
</script>
</body>
</html>
