<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Concept 9 · Orbit</title>
<style>
  :root{--bg:#f1f0f4;--ink:#17161c;--mute:#66646f;--good:#187030;--bad:#c4001a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;touch-action:none;user-select:none;overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .app{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 10px)}
  header{padding:0 6px}
  header .d{font-size:15px;color:var(--mute)}
  header h1{font-size:32px;letter-spacing:-.04em;font-weight:800;line-height:1.1}
  .notice{margin:8px 6px 0;background:rgba(196,0,26,.07);color:var(--bad);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;text-align:left;width:calc(100% - 12px)}
  .notice[hidden]{display:none}
  .info{background:#fff;border-radius:20px;margin:8px 6px 0;padding:12px 14px;display:flex;align-items:center;gap:10px}
  .info .t{flex:1;min-width:0}
  .info b{font-size:17px;letter-spacing:-.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info small{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums;display:block;margin-top:1px}
  .info button{height:38px;padding:0 14px;border-radius:12px;font-weight:700;font-size:14.5px}
  .info .p{background:var(--good);color:#fff} .info .a{background:rgba(196,0,26,.1);color:var(--bad)}
  .sky{flex:1;min-height:0;margin-top:2px}
  svg{width:100%;height:100%;display:block;touch-action:none}
  .planet{cursor:grab} .planet.drag{cursor:grabbing}
  .pname{font:700 10.5px -apple-system,Inter,sans-serif;fill:#17161c;text-anchor:middle;pointer-events:none}
  .dock text{font-family:-apple-system,Inter,sans-serif;pointer-events:none}
  .undo{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translateX(-50%);height:38px;padding:0 16px;border-radius:99px;background:rgba(0,0,0,.07);font-weight:650;font-size:14px}
  .undo:disabled{opacity:.35}
</style>
</head>
<body>
<div class="app">
  <header><div class="d" id="date"></div><h1>Orbit</h1></header>
  <button class="notice" id="notice" hidden></button>
  <div class="info" id="info"></div>
  <div class="sky"><svg id="sky" viewBox="0 0 360 470" preserveAspectRatio="xMidYMid meet"></svg></div>
</div>
<button class="undo" id="undo" disabled>Undo</button>

<script>
const NOW0=new Date(),M0=NOW0.getHours()*60+NOW0.getMinutes(),cl=v=>Math.max(0,Math.min(1439,v));
const SUBJECTS=[
  {id:'ana',name:'Anatomy',color:'#e2503f',att:20,mis:8,req:75,kind:'Practical',start:cl(M0-85),end:cl(M0-25),a:200},
  {id:'pha',name:'Pharmacology',color:'#2f6fe0',att:30,mis:3,req:75,kind:'Lecture',start:cl(M0-20),end:cl(M0+40),a:300},
  {id:'phy',name:'Physiology',color:'#1f9d61',att:15,mis:5,req:75,kind:'Lecture',start:cl(M0+75),end:cl(M0+135),a:40},
  {id:'bio',name:'Biochemistry',color:'#7c4ddb',att:26,mis:2,req:75,kind:'Tutorial',start:cl(M0+190),end:cl(M0+250),a:120},
  {id:'com',name:'Community Medicine',color:'#d98a06',att:6,mis:0,req:75,kind:'Lecture',start:null,end:null,a:250},
];
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const fmt=m=>{const h=Math.floor(m/60),mm=String(Math.floor(m)%60).padStart(2,'0');return `${h%12||12}:${mm} ${h>=12?'PM':'AM'}`};
const dur=m=>{m=Math.max(1,Math.round(m));return m<60?`${m} min`:`${Math.floor(m/60)}h ${m%60}m`};
const minutesNow=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
const phase=s=>{if(s.start===null)return'any';const n=minutesNow();return n>=s.end?'ended':n>=s.start?'now':'later'};
function stats(s){const total=s.att+s.mis,pct=total?Math.round(s.att/total*100):0,r=s.req/100;let text,risk=false;
  if(!total)text='Not started';else if(pct<s.req){const need=Math.max(1,Math.ceil((r*total-s.att)/(1-r)-1e-9));text=`Attend the next ${need} to recover`;risk=true}
  else{const k=Math.max(0,Math.floor((s.att-r*total)/r+1e-9));text=k?`${k} skip${k>1?'s':''} available`:'No skips left'}
  return {pct,text,risk}}
const marks={},hist=[];
function setMark(id,st){const s=SUBJECTS.find(x=>x.id===id),p=marks[id]||null;if(p===st)return;hist.push({id,p});
  if(p==='P')s.att--;if(p==='A')s.mis--;if(st==='P')s.att++;if(st==='A')s.mis++;if(st)marks[id]=st;else delete marks[id]}

/* ---- scene ---- */
const svg=$('#sky'),CX=180,CY=178,DOCKS={A:{x:70,y:408,r:52},P:{x:290,y:408,r:52}};
const orbitR=s=>{const p=phase(s);if(p==='now')return 62;if(p==='later')return 62+Math.min(200,Math.max(0,s.start-minutesNow()))/200*96;return 162};
const el=(n,a={},parent=svg)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);parent.appendChild(e);return e};
let planets={},sel=null,dragging=null;

function scaffold(){
  svg.innerHTML='';
  const defs=el('defs');const g=el('radialGradient',{id:'sun',cx:'40%',cy:'35%',r:'70%'},defs);el('stop',{offset:0,'stop-color':'#fff'},g);el('stop',{offset:1,'stop-color':'#e9e7f2'},g);
  [[62,'now'],[90,'1h'],[120,'2h'],[150,'3h']].forEach(([r,l])=>{el('circle',{cx:CX,cy:CY,r,fill:'none',stroke:'rgba(23,22,28,.13)','stroke-dasharray':'2 5','stroke-width':1.4});
    const t=el('text',{x:CX,y:CY-r-3,'text-anchor':'middle','font-size':9,'font-weight':700,fill:'#8a8794','letter-spacing':'.06em'});t.textContent=l.toUpperCase()});
  el('circle',{cx:CX,cy:CY,r:162,fill:'none',stroke:'rgba(196,0,26,.28)','stroke-dasharray':'3 6','stroke-width':1.4});
  const t2=el('text',{x:CX,y:CY+172,'text-anchor':'middle','font-size':9,'font-weight':700,fill:'rgba(196,0,26,.7)','letter-spacing':'.06em'});t2.textContent='EARLIER / ANY TIME';
  el('circle',{cx:CX,cy:CY,r:34,fill:'url(#sun)',stroke:'rgba(0,0,0,.12)','stroke-width':1.5});
  el('text',{id:'suntime',x:CX,y:CY+4,'text-anchor':'middle','font-size':13,'font-weight':800,fill:'#17161c'});
  el('text',{x:CX,y:CY+17,'text-anchor':'middle','font-size':7.5,'font-weight':800,fill:'#8a8794','letter-spacing':'.1em'}).textContent='NOW';
  for(const k of ['A','P']){const d=DOCKS[k],c=k==='P'?'#187030':'#c4001a',g=el('g',{class:'dock',id:'dock'+k});
    el('circle',{id:'ring'+k,cx:d.x,cy:d.y,r:d.r,fill:k==='P'?'rgba(24,112,48,.09)':'rgba(196,0,26,.08)',stroke:c,'stroke-width':2,'stroke-dasharray':'5 5'},g);
    el('text',{x:d.x,y:d.y-4,'text-anchor':'middle','font-size':12,'font-weight':800,fill:c,'letter-spacing':'.06em'},g).textContent=k==='P'?'PRESENT':'ABSENT';
    el('text',{id:'cnt'+k,x:d.x,y:d.y+18,'text-anchor':'middle','font-size':20,'font-weight':800,fill:c},g).textContent='0'}
  el('g',{id:'moons'});el('g',{id:'planets'});
}
function ensurePlanet(s){
  if(planets[s.id])return planets[s.id];
  const g=el('g',{class:'planet'},$('#planets'));g.dataset.id=s.id;
  const halo=el('circle',{r:0,fill:'none',stroke:'#c4001a','stroke-width':2.5,opacity:0},g);
  const body=el('circle',{r:16,fill:s.color,stroke:'#fff','stroke-width':2.5},g);
  const hi=el('circle',{r:4,fill:'rgba(255,255,255,.55)',cx:-5,cy:-5},g);
  const txt=el('text',{class:'pname',y:30},g);txt.textContent=s.name.split(' ')[0];
  const pct=el('text',{y:4,'text-anchor':'middle','font-size':10,'font-weight':800,fill:'#fff','pointer-events':'none'},g);
  planets[s.id]={s,g,halo,body,hi,txt,pct,ang:s.a,x:0,y:0};
  g.addEventListener('pointerdown',e=>startDrag(e,s.id));
  return planets[s.id];
}
const toSvg=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return {x:q.x,y:q.y}};

/* ---- dragging ---- */
function startDrag(e,id){if(marks[id])return;e.preventDefault();const P=planets[id];svg.setPointerCapture(e.pointerId);sel=id;
  dragging={id,moved:false,x0:e.clientX,y0:e.clientY};P.g.classList.add('drag');$('#planets').appendChild(P.g);paintInfo()}
svg.addEventListener('pointermove',e=>{if(!dragging)return;const P=planets[dragging.id];
  if(Math.hypot(e.clientX-dragging.x0,e.clientY-dragging.y0)>6)dragging.moved=true;
  if(!dragging.moved)return;const q=toSvg(e);P.x=q.x;P.y=q.y;
  for(const k of ['A','P']){const d=DOCKS[k],hot=Math.hypot(q.x-d.x,q.y-d.y)<d.r+6;$('#ring'+k).setAttribute('stroke-width',hot?5:2);$('#ring'+k).setAttribute('stroke-dasharray',hot?'0':'5 5')}});
function endDrag(e){if(!dragging)return;const P=planets[dragging.id],d=dragging;dragging=null;P.g.classList.remove('drag');
  for(const k of ['A','P']){$('#ring'+k).setAttribute('stroke-width',2);$('#ring'+k).setAttribute('stroke-dasharray','5 5')}
  if(!d.moved){paintInfo();return}
  const q=toSvg(e);for(const k of ['A','P']){const dk=DOCKS[k];if(Math.hypot(q.x-dk.x,q.y-dk.y)<dk.r+6){land(d.id,k);return}}}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);

function land(id,k){const P=planets[id];P.landing={k,t:0};setMark(id,k);}
function removePlanet(id){const P=planets[id];if(P){P.g.remove();delete planets[id]}}

/* ---- loop ---- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const n=minutesNow();
  $('#suntime').textContent=fmt(Math.floor(n)).replace(' ','');
  for(const s of SUBJECTS){
    if(marks[s.id]&&!(planets[s.id]&&planets[s.id].landing))continue;
    const P=ensurePlanet(s);const i=stats(s);
    const r=orbitR(s);P.r=P.r===undefined?r:P.r+(r-P.r)*Math.min(1,dt*3);
    const size=15+i.pct/100*11;
    P.body.setAttribute('r',size);P.hi.setAttribute('r',size*.26);P.hi.setAttribute('cx',-size*.32);P.hi.setAttribute('cy',-size*.34);
    P.txt.setAttribute('y',size+13);P.pct.textContent=i.pct;P.pct.setAttribute('y',4);
    P.halo.setAttribute('r',size+6);P.halo.setAttribute('opacity',i.risk?.9:0);
    P.body.setAttribute('stroke-dasharray',s.start===null?'4 3':'0');P.body.setAttribute('stroke',s.start===null?'#17161c':'#fff');
    if(P.landing){P.landing.t+=dt*3.2;const dk=DOCKS[P.landing.k],t=Math.min(1,P.landing.t);
      P.x+=(dk.x-P.x)*Math.min(1,dt*14);P.y+=(dk.y-P.y)*Math.min(1,dt*14);P.g.setAttribute('transform',`translate(${P.x},${P.y}) scale(${1-t*.9})`);P.g.style.opacity=1-t;
      if(t>=1){removePlanet(s.id);paintMoons();paintInfo();paint()}continue}
    if(!(dragging&&dragging.id===s.id&&dragging.moved)){
      if(!(dragging&&dragging.id===s.id)&&sel!==s.id||true){P.ang+=dt*120/Math.max(50,P.r)*(s.start===null?-1:1)}
      P.x=CX+P.r*Math.cos(P.ang*Math.PI/180);P.y=CY+P.r*Math.sin(P.ang*Math.PI/180)}
    P.g.setAttribute('transform',`translate(${P.x},${P.y})`);P.g.style.opacity=1;
    P.g.style.filter=sel===s.id?'drop-shadow(0 0 0 #000)':'none';P.body.setAttribute('stroke-width',sel===s.id?4:2.5);
  }
  requestAnimationFrame(frame);
}

/* ---- ui ---- */
function paintMoons(){
  const g=$('#moons');g.innerHTML='';let cP=0,cA=0;
  for(const id in marks){const s=SUBJECTS.find(x=>x.id===id),k=marks[id],d=DOCKS[k],idx=k==='P'?cP++:cA++;
    const a=(200+idx*26)*Math.PI/180,r=d.r+11;el('circle',{cx:d.x+r*Math.cos(a+ (k==='P'?0:Math.PI)),cy:d.y+r*Math.sin(a)*(-1),r:7,fill:s.color,stroke:'#fff','stroke-width':1.5},g)}
  $('#cntP').textContent=Object.values(marks).filter(v=>v==='P').length;$('#cntA').textContent=Object.values(marks).filter(v=>v==='A').length;
  $('#undo').disabled=!hist.length;
}
function paintInfo(){
  const pend=SUBJECTS.filter(s=>!marks[s.id]),n=minutesNow();
  if(!pend.length){$('#info').innerHTML='<div class="t"><b>All caught up</b><small>Every planet has landed.</small></div>';return}
  const s=SUBJECTS.find(x=>x.id===sel&&!marks[x.id])||pend.find(x=>phase(x)==='now')||pend.find(x=>phase(x)==='later')||pend[0];sel=s.id;
  const i=stats(s),p=phase(s);
  $('#info').innerHTML=`<div class="t"><b>${s.name}</b><small>${s.start===null?'Any time':`${fmt(s.start)} · ${p==='now'?`ends in ${dur(s.end-n)}`:p==='ended'?`ended ${dur(n-s.end)} ago`:`in ${dur(s.start-n)}`}`} · ${i.pct}% · ${i.text}</small></div><button class="a" data-m="A">Absent</button><button class="p" data-m="P">Present</button>`;
  $('#info').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(planets[s.id]&&!planets[s.id].landing){const P=planets[s.id];P.x=P.x||CX;land(s.id,b.dataset.m)}});
}
function paint(){
  $('#date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'});
  const n=minutesNow(),late=SUBJECTS.filter(s=>phase(s)==='ended'&&!marks[s.id]),nt=$('#notice');
  if(late.length){nt.hidden=false;nt.textContent=late.length>1?`${late.length} classes ended without a mark`:`${late[0].name} ended ${dur(n-late[0].end)} ago and isn’t marked`;nt.onclick=()=>{sel=late[0].id;paintInfo()}}else nt.hidden=true;
}
$('#undo').onclick=()=>{const h=hist.pop();if(!h)return;const s=SUBJECTS.find(x=>x.id===h.id),c=marks[h.id]||null;if(c==='P')s.att--;if(c==='A')s.mis--;if(h.p==='P')s.att++;if(h.p==='A')s.mis++;if(h.p)marks[h.id]=h.p;else delete marks[h.id];sel=h.id;paintMoons();paintInfo();paint()};
scaffold();paint();paintMoons();paintInfo();requestAnimationFrame(frame);setInterval(paint,20000);
window.__orbit=()=>({planets:Object.keys(planets),marks:{...marks},p:planets});
</script>
</body>
</html>
