<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Concept 2 · Swipe deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f4ef;--ink:#15130f;--mute:#6b675e;--good:#187030;--bad:#c4001a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font:16px/1.4 Sora,-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;touch-action:none;user-select:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .app{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 18px)}

  .top{display:flex;align-items:baseline;justify-content:space-between}
  .top h1{font-size:15px;font-weight:600;color:var(--mute)}
  .left{font-size:15px;font-weight:700}
  .segs{display:flex;gap:5px;margin:12px 0 0}
  .seg{flex:1;height:5px;border-radius:5px;background:rgba(21,19,15,.12);transition:background .3s}
  .seg.p{background:var(--good)} .seg.a{background:var(--bad)} .seg.cur{background:var(--ink)}

  .stage{flex:1;position:relative;margin:22px 0 18px;min-height:0}
  .card{position:absolute;inset:0;border-radius:32px;padding:24px;display:flex;flex-direction:column;background:var(--bg-c);will-change:transform;transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .35s}
  .card.drag{transition:none}
  .card .stamp{position:absolute;top:26px;font-size:22px;font-weight:800;letter-spacing:.06em;padding:6px 14px;border:3px solid;border-radius:12px;opacity:0;pointer-events:none}
  .stamp.p{left:24px;color:var(--good);border-color:var(--good);transform:rotate(-8deg)}
  .stamp.a{right:24px;color:var(--bad);border-color:var(--bad);transform:rotate(8deg)}
  .c-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
  .pill{background:rgba(255,255,255,.7);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:800;letter-spacing:.06em}
  .c-name{font-size:40px;line-height:1.04;font-weight:800;letter-spacing:-.045em;margin-top:auto}
  .c-time{font-size:17px;font-weight:600;margin-top:12px;font-variant-numeric:tabular-nums}
  .c-row{display:flex;align-items:center;gap:16px;margin-top:22px}
  .ring{position:relative;width:88px;height:88px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:23px;font-weight:800;letter-spacing:-.04em}
  .c-txt{font-size:15px;font-weight:600;line-height:1.35}
  .c-txt small{display:block;font-weight:500;opacity:.7;margin-top:2px}
  .hint{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:12.5px;color:var(--mute);pointer-events:none}

  .actions{display:flex;justify-content:center;align-items:center;gap:22px}
  .rb{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:28px;font-weight:700;box-shadow:0 1px 0 rgba(0,0,0,.06)}
  .rb.a{color:var(--bad)} .rb.p{color:var(--good)}
  .rb.u{width:48px;height:48px;font-size:22px;color:var(--mute)}
  .rb:active{transform:scale(.94)}
  .rb:disabled{opacity:.35}

  .done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
  .done .big{width:96px;height:96px;border-radius:50%;background:rgba(24,112,48,.12);color:var(--good);display:grid;place-items:center;font-size:46px;font-weight:800}
  .done h2{font-size:30px;letter-spacing:-.04em;font-weight:800}
  .done p{color:var(--mute);font-size:15px}
  .sum{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .sum span{background:#fff;border-radius:99px;padding:7px 14px;font-size:13.5px;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1 id="date"></h1><div class="left" id="left"></div></div>
  <div class="segs" id="segs"></div>
  <div class="stage" id="stage"></div>
  <div class="actions">
    <button class="rb a" id="bA" aria-label="Absent">✕</button>
    <button class="rb u" id="bU" aria-label="Undo">↶</button>
    <button class="rb p" id="bP" aria-label="Present">✓</button>
  </div>
</div>

<script>
const NOW0=new Date(), M0=NOW0.getHours()*60+NOW0.getMinutes(), cl=v=>Math.max(0,Math.min(1439,v));
const SUBJECTS=[
  {id:'ana',name:'Anatomy',color:'#ff5a4d',att:20,mis:8,req:75,kind:'Practical',start:cl(M0-85),end:cl(M0-25)},
  {id:'pha',name:'Pharmacology',color:'#2f7cf6',att:30,mis:3,req:75,kind:'Lecture',start:cl(M0-20),end:cl(M0+40)},
  {id:'phy',name:'Physiology',color:'#1fae6b',att:15,mis:5,req:75,kind:'Lecture',start:cl(M0+75),end:cl(M0+135)},
  {id:'bio',name:'Biochemistry',color:'#8b5cf6',att:26,mis:2,req:75,kind:'Tutorial',start:cl(M0+190),end:cl(M0+250)},
  {id:'com',name:'Community Medicine',color:'#f59e0b',att:6,mis:0,req:75,kind:'Lecture',start:null,end:null},
];
const $=s=>document.querySelector(s);
const fmt=m=>{const h=Math.floor(m/60),mm=String(m%60).padStart(2,'0');return `${h%12||12}:${mm} ${h>=12?'PM':'AM'}`};
const dur=m=>{m=Math.max(1,Math.round(m));return m<60?`${m} min`:`${Math.floor(m/60)}h${m%60?` ${m%60}m`:''}`};
const mix=(hex,a)=>{const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,m=v=>Math.round(v*a+255*(1-a));return `rgb(${m(r)},${m(g)},${m(b)})`};
function stats(s){const total=s.att+s.mis,pct=total?Math.round(s.att/total*100):0,r=s.req/100;let text,status;
  if(!total){text='Not started';status='new'}
  else if(pct<s.req){const need=Math.max(1,Math.ceil((r*total-s.att)/(1-r)-1e-9));text=`Attend the next ${need} to recover`;status='risk'}
  else{const k=Math.max(0,Math.floor((s.att-r*total)/r+1e-9));status=k?'safe':'edge';text=k?`${k} skip${k>1?'s':''} available`:'No skips left'}
  return {pct,text,status}}

/* deck order: chronological, untimed last */
const deck=[...SUBJECTS.filter(s=>s.start!==null).sort((a,b)=>a.start-b.start),...SUBJECTS.filter(s=>s.start===null)];
const marks={}; const history=[];
const pending=()=>deck.filter(s=>!marks[s.id]);
const minutesNow=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function phase(s){if(s.start===null)return 'any';const n=minutesNow();return n>=s.start&&n<s.end?'now':n>=s.end?'ended':'later'}

function cardHTML(s){
  const i=stats(s),p=phase(s),n=minutesNow();
  const label=p==='now'?'NOW':p==='ended'?'ENDED':p==='later'?'UP NEXT':'ANY TIME';
  const when=s.start===null?'No fixed time today':`${fmt(s.start)} – ${fmt(s.end)}`;
  const sub=p==='now'?`Ends in ${dur(s.end-n)}`:p==='ended'?`Ended ${dur(n-s.end)} ago`:p==='later'?`Starts in ${dur(s.start-n)}`:'Mark it whenever you attend';
  const C=2*Math.PI*38,off=C*(1-i.pct/100),col=i.status==='risk'?'#c4001a':'#15130f';
  return `<div class="stamp p">PRESENT</div><div class="stamp a">ABSENT</div>
    <div class="c-top"><span>${s.kind}</span><span class="pill">${label}</span></div>
    <div class="c-name">${s.name}</div>
    <div class="c-time">${when}<br><span style="font-weight:500;opacity:.7;font-size:14px">${sub}</span></div>
    <div class="c-row"><div class="ring"><svg width="88" height="88" viewBox="0 0 88 88"><circle cx="44" cy="44" r="38" fill="none" stroke="rgba(21,19,15,.12)" stroke-width="9"/>
      <circle cx="44" cy="44" r="38" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><b>${i.pct}%</b></div>
      <div class="c-txt">${i.text}<small>needs ${s.req}% · ${s.att} of ${s.att+s.mis} attended</small></div></div>`;
}

let depth=3;
function render(){
  const pend=pending(), stage=$('#stage');
  $('#date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'});
  $('#left').textContent=pend.length?`${pend.length} to mark`:'All marked';
  $('#segs').innerHTML=deck.map(s=>`<div class="seg ${marks[s.id]==='P'?'p':marks[s.id]==='A'?'a':(pend[0]&&pend[0].id===s.id)?'cur':''}"></div>`).join('');
  $('#bU').disabled=!history.length; $('#bP').disabled=$('#bA').disabled=!pend.length;
  if(!pend.length){
    const p=Object.values(marks).filter(v=>v==='P').length,a=Object.values(marks).filter(v=>v==='A').length;
    stage.innerHTML=`<div class="done"><div class="big">✓</div><h2>You’re all caught up</h2><p>Every class today is marked.</p>
      <div class="sum"><span style="color:var(--good)">${p} present</span><span style="color:var(--bad)">${a} absent</span></div></div>`;
    return;
  }
  stage.innerHTML=pend.slice(0,depth).map((s,k)=>`<div class="card ${k===0?'top':''}" data-id="${s.id}" style="--bg-c:${mix(s.color,.28)};z-index:${10-k};transform:translateY(${k*14}px) scale(${1-k*.05});opacity:${k===0?1:1-k*.25}">${k===0?cardHTML(s):''}</div>`).reverse().join('')+
    `<div class="hint">Swipe right if you were there · left if you weren’t</div>`;
  const top=stage.querySelector('.card.top'); attach(top);
}

/* ---- drag ---- */
function attach(card){
  let sx=0,sy=0,dx=0,drag=false;
  const stP=card.querySelector('.stamp.p'),stA=card.querySelector('.stamp.a');
  card.style.touchAction='none';
  card.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;card.classList.add('drag');card.setPointerCapture(e.pointerId)});
  card.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;const dy=(e.clientY-sy)*.25;
    card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    stP.style.opacity=Math.max(0,Math.min(1,dx/90));stA.style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const end=()=>{if(!drag)return;drag=false;card.classList.remove('drag');
    if(dx>90)resolve('P');else if(dx<-90)resolve('A');
    else{card.style.transform='';stP.style.opacity=stA.style.opacity=0}dx=0};
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
}
function resolve(st){
  const pend=pending();if(!pend.length)return;const s=pend[0];
  const card=document.querySelector('.card.top');
  if(card){card.classList.remove('drag');const dir=st==='P'?1:-1;
    card.style.transform=`translate(${dir*520}px,-30px) rotate(${dir*28}deg)`;card.style.opacity=0;
    const stamp=card.querySelector(st==='P'?'.stamp.p':'.stamp.a');if(stamp)stamp.style.opacity=1}
  setTimeout(()=>{marks[s.id]=st;history.push(s.id);if(st==='P')s.att++;else s.mis++;render()},260);
}
function undo(){const id=history.pop();if(!id)return;const s=SUBJECTS.find(x=>x.id===id),st=marks[id];
  if(st==='P')s.att--;else s.mis--;delete marks[id];render()}
$('#bP').onclick=()=>resolve('P');$('#bA').onclick=()=>resolve('A');$('#bU').onclick=undo;
addEventListener('keydown',e=>{if(e.key==='ArrowRight')resolve('P');if(e.key==='ArrowLeft')resolve('A');if(e.key==='Backspace'||e.key==='z')undo()});
render();setInterval(()=>{if(!document.querySelector('.card.drag'))render()},30000);
</script>
</body>
</html>
